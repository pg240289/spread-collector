name: Sample order books

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to keep sampling (minutes). Use 5 for a quick test.'
        default: '5'
  schedule:
    # GitHub cron is UTC. IST = UTC + 5:30.
    # GitHub's scheduler drops or delays events unpredictably, so coverage is built on redundancy:
    #  - an anchor run at 09:10 IST that samples every 5 minutes for ~5h50m (09:10–15:00), and
    #  - hourly backup runs (10:10 … 15:10 IST) of ~62 minutes each; the 15:10 run covers the close.
    # Duplicate samples for the same 5-minute slot are de-duplicated in analysis.
    - cron: '40 3 * * 1-5'
    - cron: '40 4-9 * * 1-5'

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install --quiet requests

      - name: Sample every 5 minutes and commit each snapshot
        env:
          COLLECTOR_NAME: github-actions
          INPUT_MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          git config user.name "sampler-bot"
          git config user.email "sampler-bot@users.noreply.github.com"
          if [ -n "$INPUT_MINUTES" ]; then
            DURATION_MIN="$INPUT_MINUTES"
          elif [ "$(date -u +%H)" = "03" ]; then
            DURATION_MIN=350
          else
            DURATION_MIN=62
          fi
          echo "Sampling for $DURATION_MIN minutes (started $(date -u +%H:%M:%SZ))"
          start=$(date +%s)
          end=$((start + DURATION_MIN * 60))
          while [ "$(date +%s)" -lt "$end" ]; do
            python sampler.py || echo "sampler failed at $(date -u +%H:%M:%SZ)"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "sample $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do
                git pull --rebase -q && git push -q && break
                echo "push failed, retry $i"; sleep 5
              done
            fi
            now=$(date +%s)
            next=$(( (now / 300 + 1) * 300 ))
            if [ "$next" -ge "$end" ]; then break; fi
            sleep $((next - now))
          done
